<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">Online learning platform showcase</title>
  <desc id="desc">A polished learning homepage mockup with live classes, course cards, progress and learner activity.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="720" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4fbf8"/>
      <stop offset="0.55" stop-color="#eef6fb"/>
      <stop offset="1" stop-color="#f8f2ea"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#19a58d"/>
      <stop offset="1" stop-color="#2f63c7"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8644d"/>
      <stop offset="1" stop-color="#c97f1a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7060bd"/>
      <stop offset="1" stop-color="#2f63c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16322d" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#16322d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="640" rx="34" fill="url(#bg)"/>
  <circle cx="647" cy="118" r="92" fill="#dfeeff" opacity="0.62"/>
  <circle cx="102" cy="502" r="112" fill="#dff4ee" opacity="0.72"/>
  <path d="M74 166 C166 90 277 98 344 171 C421 255 550 236 658 175" fill="none" stroke="#168875" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.45"/>

  <g filter="url(#shadow)">
    <rect x="72" y="70" width="616" height="492" rx="26" fill="#ffffff"/>
  </g>

  <rect x="72" y="70" width="616" height="66" rx="26" fill="#fbfdfb"/>
  <circle cx="111" cy="103" r="16" fill="url(#teal)"/>
  <path d="M104 102 h14 M111 95 v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="146" y="89" width="176" height="30" rx="15" fill="#eef3f1"/>
  <circle cx="166" cy="104" r="7" fill="none" stroke="#7b8883" stroke-width="3"/>
  <path d="M171 109 l8 8" stroke="#7b8883" stroke-width="3" stroke-linecap="round"/>
  <rect x="540" y="90" width="68" height="28" rx="14" fill="#f2f7f5"/>
  <text x="574" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#5f6d68">Live</text>
  <circle cx="631" cy="104" r="14" fill="#f0c35a"/>
  <circle cx="653" cy="104" r="14" fill="#70b970"/>

  <rect x="90" y="154" width="64" height="390" rx="18" fill="#f3f6f5"/>
  <g fill="#83908b">
    <rect x="112" y="184" width="20" height="20" rx="6"/>
    <rect x="112" y="238" width="20" height="20" rx="6"/>
    <rect x="112" y="292" width="20" height="20" rx="6"/>
    <rect x="112" y="346" width="20" height="20" rx="6"/>
  </g>
  <rect x="104" y="174" width="36" height="38" rx="12" fill="#e3eee9"/>
  <rect x="113" y="184" width="18" height="18" rx="5" fill="#168875"/>


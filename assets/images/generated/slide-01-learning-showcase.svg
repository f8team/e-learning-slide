  <text x="401" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#16201d">10:30</text>
  <text x="563" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#16201d">Live</text>
  <g font-family="Inter, Arial, sans-serif" fill="#16201d">
    <text x="208" y="346" font-size="16" font-weight="900">Course card</text>
    <text x="370" y="346" font-size="16" font-weight="900">Skill path</text>
    <text x="532" y="346" font-size="16" font-weight="900">Workshop</text>
  </g>
  <g fill="#cfd8d5">
    <rect x="208" y="368" width="90" height="9" rx="5"/>
    <rect x="208" y="386" width="64" height="9" rx="5"/>
    <rect x="370" y="368" width="88" height="9" rx="5"/>
    <rect x="370" y="386" width="70" height="9" rx="5"/>
    <rect x="532" y="368" width="84" height="9" rx="5"/>
    <rect x="532" y="386" width="62" height="9" rx="5"/>
  </g>
  <g fill="#f0c35a">
    <circle cx="213" cy="414" r="5"/>
    <circle cx="229" cy="414" r="5"/>
    <circle cx="245" cy="414" r="5"/>
    <circle cx="375" cy="414" r="5"/>
    <circle cx="391" cy="414" r="5"/>
    <circle cx="407" cy="414" r="5"/>
    <circle cx="537" cy="414" r="5"/>
    <circle cx="553" cy="414" r="5"/>
    <circle cx="569" cy="414" r="5"/>
  </g>

  <g filter="url(#soft)">

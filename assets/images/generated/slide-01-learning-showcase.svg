    <rect x="480" y="462" width="174" height="62" rx="18" fill="#f8fbfa"/>
  </g>
  <text x="210" y="489" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" fill="#16201d">Learner progress</text>
  <rect x="210" y="502" width="190" height="10" rx="5" fill="#dfe8e5"/>
  <rect x="210" y="502" width="132" height="10" rx="5" fill="#168875"/>
  <text x="504" y="489" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" fill="#16201d">Community</text>
  <g>
    <circle cx="514" cy="508" r="12" fill="#168875"/>
    <circle cx="538" cy="508" r="12" fill="#2f63c7"/>
    <circle cx="562" cy="508" r="12" fill="#c97f1a"/>
    <circle cx="586" cy="508" r="12" fill="#7060bd"/>

    <rect x="350" y="238" width="142" height="198" rx="20" fill="#ffffff"/>
    <rect x="512" y="238" width="142" height="198" rx="20" fill="#ffffff"/>
  </g>
  <rect x="188" y="238" width="142" height="72" rx="20" fill="url(#coral)"/>
  <rect x="350" y="238" width="142" height="72" rx="20" fill="url(#teal)"/>
  <rect x="512" y="238" width="142" height="72" rx="20" fill="url(#violet)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">Mature platform deployment catalog</title>
  <desc id="desc">A clean catalog and rollout mockup showing content categories, operating workflows and deployment steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f7ff"/>
      <stop offset="0.54" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#fff5ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2f63c7"/>
      <stop offset="1" stop-color="#168875"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c95b4b"/>
      <stop offset="1" stop-color="#c97f1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#16201d" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#16201d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="640" rx="34" fill="url(#bg)"/>
  <path d="M84 156 C188 94 332 106 426 162 C528 222 626 223 696 174" fill="none" stroke="#2f63c7" stroke-width="74" stroke-linecap="round" opacity="0.08"/>
  <path d="M102 470 C218 414 331 440 438 496 C536 548 631 526 682 476" fill="none" stroke="#c97f1a" stroke-width="80" stroke-linecap="round" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="78" y="88" width="604" height="462" rx="28" fill="#ffffff"/>
  </g>
  <rect x="78" y="88" width="604" height="64" rx="28" fill="#fbfdfb"/>
  <rect x="108" y="109" width="160" height="26" rx="13" fill="#eef3f8"/>
  <circle cx="128" cy="122" r="7" fill="none" stroke="#778681" stroke-width="3"/>
  <path d="M133 127 l8 8" stroke="#778681" stroke-width="3" stroke-linecap="round"/>
  <rect x="532" y="107" width="98" height="30" rx="15" fill="#fff2eb"/>
  <text x="581" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#c95b4b">Ready</text>

  <g filter="url(#soft)">
    <rect x="110" y="176" width="206" height="324" rx="22" fill="#f8fbfa"/>
  </g>
  <text x="134" y="212" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#16201d">Catalog</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850">
    <rect x="128" y="236" width="164" height="42" rx="15" fill="#eaf2ff"/>
    <text x="152" y="263" fill="#2f63c7">Business</text>
    <path d="M267 250 l8 8 l-8 8" fill="none" stroke="#2f63c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="292" width="164" height="42" rx="15" fill="#ffffff"/>
    <text x="152" y="319" fill="#5f6d68">Technology</text>
    <rect x="128" y="348" width="164" height="42" rx="15" fill="#ffffff"/>
    <text x="152" y="375" fill="#5f6d68">Language</text>
    <rect x="128" y="404" width="164" height="42" rx="15" fill="#ffffff"/>
    <text x="152" y="431" fill="#5f6d68">Creative</text>
  </g>

  <text x="352" y="214" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="950" fill="#2f63c7">Mature workflows</text>
  <line x1="352" y1="235" x2="620" y2="235" stroke="#dce5e2" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="352" y="274" font-size="16" font-weight="900" fill="#16201d">Teaching</text>
    <text x="506" y="274" font-size="16" font-weight="900" fill="#16201d">Operations</text>
    <g fill="#eef3f1">
      <rect x="352" y="294" width="86" height="28" rx="14"/>
      <rect x="446" y="294" width="46" height="28" rx="14"/>
      <rect x="506" y="294" width="70" height="28" rx="14"/>
      <rect x="584" y="294" width="54" height="28" rx="14"/>
      <rect x="352" y="340" width="96" height="28" rx="14"/>
      <rect x="456" y="340" width="66" height="28" rx="14"/>
      <rect x="506" y="386" width="90" height="28" rx="14"/>
      <rect x="604" y="386" width="54" height="28" rx="14"/>
    </g>
    <g fill="#5f6d68" font-size="12" font-weight="850">
      <text x="395" y="313" text-anchor="middle">Courses</text>
      <text x="469" y="313" text-anchor="middle">Quiz</text>
      <text x="541" y="313" text-anchor="middle">Roles</text>
      <text x="611" y="313" text-anchor="middle">Data</text>
      <text x="400" y="359" text-anchor="middle">Certificates</text>
      <text x="489" y="359" text-anchor="middle">Q&amp;A</text>
      <text x="551" y="405" text-anchor="middle">Payments</text>
      <text x="631" y="405" text-anchor="middle">Email</text>
    </g>
  </g>

  <g filter="url(#soft)">
    <rect x="350" y="450" width="286" height="72" rx="20" fill="#16201d"/>
  </g>
  <text x="376" y="480" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Rollout path</text>
  <g>
    <circle cx="392" cy="503" r="10" fill="#168875"/>
    <circle cx="478" cy="503" r="10" fill="#2f63c7"/>
    <circle cx="564" cy="503" r="10" fill="#c97f1a"/>
    <path d="M404 503 h62 M490 503 h62" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <text x="392" y="531" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="850" fill="#dfe8e5">Demo</text>
    <text x="478" y="531" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="850" fill="#dfe8e5">Launch</text>
    <text x="564" y="531" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="850" fill="#dfe8e5">Scale</text>
  </g>

  <g filter="url(#soft)">
    <rect x="570" y="154" width="64" height="64" rx="19" fill="#ffffff"/>
  </g>
  <path d="M592 187 l10 10 l22 -28" fill="none" stroke="#168875" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="604" cy="184" r="84" fill="none" stroke="url(#warm)" stroke-width="4" stroke-dasharray="2 14" opacity="0.58"/>
</svg>

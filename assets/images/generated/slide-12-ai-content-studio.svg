<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">AI content studio</title>
  <desc id="desc">An AI authoring workspace for lesson drafts, quizzes, SEO blog posts, captions and translations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f4ff"/>
      <stop offset="0.56" stop-color="#fbfdfb"/>
      <stop offset="1" stop-color="#eef8f4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7060bd"/>
      <stop offset="1" stop-color="#2f63c7"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#168875"/>
      <stop offset="1" stop-color="#5f8f3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#16201d" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#16201d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="640" rx="34" fill="url(#bg)"/>
  <circle cx="620" cy="154" r="94" fill="#e5e0ff" opacity="0.7"/>
  <circle cx="149" cy="516" r="114" fill="#def3eb" opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="620" height="500" rx="28" fill="#ffffff"/>
  </g>
  <rect x="70" y="70" width="92" height="500" rx="28" fill="#18221f"/>
  <circle cx="116" cy="108" r="17" fill="url(#violet)"/>
  <path d="M108 108 h16 M116 100 v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <g fill="#44504c">
    <rect x="96" y="154" width="40" height="38" rx="13"/>
    <rect x="96" y="214" width="40" height="38" rx="13"/>
    <rect x="96" y="274" width="40" height="38" rx="13"/>
    <rect x="96" y="334" width="40" height="38" rx="13"/>
  </g>
  <rect x="96" y="214" width="40" height="38" rx="13" fill="#3d5fd7"/>
  <text x="116" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="950" fill="#fff">AI</text>

  <text x="192" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="950" fill="#16201d">AI content studio</text>
  <rect x="192" y="142" width="206" height="28" rx="14" fill="#f0f3f2"/>
  <text x="212" y="161" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="850" fill="#5f6d68">Lesson, quiz, blog, captions</text>

  <g filter="url(#soft)">
    <rect x="192" y="196" width="298" height="150" rx="20" fill="#f8fbfa"/>
  </g>
  <text x="216" y="230" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="950" fill="#16201d">Prompt brief</text>
  <rect x="216" y="248" width="248" height="15" rx="8" fill="#cfd8d5"/>
  <rect x="216" y="278" width="214" height="15" rx="8" fill="#dce4e1"/>
  <rect x="216" y="308" width="238" height="15" rx="8" fill="#dce4e1"/>
  <rect x="394" y="214" width="70" height="28" rx="14" fill="#ece7ff"/>
  <text x="429" y="233" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="950" fill="#7060bd">Draft</text>

  <g filter="url(#soft)">
    <rect x="192" y="374" width="298" height="122" rx="20" fill="#ffffff"/>
  </g>
  <text x="216" y="408" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="950" fill="#16201d">Publishing schedule</text>
  <g fill="#eff3f1">
    <rect x="216" y="428" width="64" height="36" rx="12"/>
    <rect x="294" y="428" width="64" height="36" rx="12"/>
    <rect x="372" y="428" width="64" height="36" rx="12"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="950" fill="#5f6d68">
    <text x="248" y="451" text-anchor="middle">09:00</text>
    <text x="326" y="451" text-anchor="middle">12:30</text>
    <text x="404" y="451" text-anchor="middle">17:00</text>
  </g>

  <g filter="url(#soft)">
    <rect x="520" y="162" width="118" height="94" rx="22" fill="#ffffff"/>
    <rect x="520" y="276" width="118" height="94" rx="22" fill="#ffffff"/>
    <rect x="520" y="390" width="118" height="94" rx="22" fill="#ffffff"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="548" cy="202" r="16" fill="#ece7ff"/>
    <text x="579" y="198" font-size="13" font-weight="950" fill="#16201d">Quiz</text>
    <text x="579" y="220" font-size="11" font-weight="800" fill="#6b7773">checks</text>
    <circle cx="548" cy="316" r="16" fill="#dff4ee"/>
    <text x="579" y="312" font-size="13" font-weight="950" fill="#16201d">SEO</text>
    <text x="579" y="334" font-size="11" font-weight="800" fill="#6b7773">blog</text>
    <circle cx="548" cy="430" r="16" fill="#fff0d8"/>
    <text x="579" y="426" font-size="13" font-weight="950" fill="#16201d">CC</text>
    <text x="579" y="448" font-size="11" font-weight="800" fill="#6b7773">translate</text>
  </g>

  <g filter="url(#soft)">
    <rect x="312" y="520" width="188" height="46" rx="18" fill="url(#teal)"/>
  </g>
  <text x="406" y="549" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="950" fill="#fff">Generate content</text>

  <path d="M486 214 C510 206 513 201 528 198" fill="none" stroke="#7060bd" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M486 320 C510 314 513 315 528 316" fill="none" stroke="#168875" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M486 432 C510 428 513 430 528 430" fill="none" stroke="#c97f1a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g fill="#7060bd">
    <path d="M638 112 l6 14 l15 5 l-14 6 l-6 15 l-6 -15 l-14 -6 l15 -5z" opacity="0.76"/>
    <path d="M505 120 l4 9 l9 3 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -3z" opacity="0.58"/>
  </g>
</svg>

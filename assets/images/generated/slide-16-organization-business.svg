<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">Organization and business expansion</title>
  <desc id="desc">A neutral admin mockup showing organizations, domains, course scope and business configuration on one platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3fbf7"/>
      <stop offset="0.55" stop-color="#fbfdfb"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#168875"/>
      <stop offset="1" stop-color="#5f8f3f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2f63c7"/>
      <stop offset="1" stop-color="#7060bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#16201d" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#16201d" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="760" height="640" rx="34" fill="url(#bg)"/>
  <circle cx="625" cy="142" r="96" fill="#dfeaff" opacity="0.7"/>
  <circle cx="122" cy="508" r="108" fill="#dff4ee" opacity="0.72"/>

  <g filter="url(#shadow)">
    <rect x="66" y="72" width="628" height="496" rx="28" fill="#ffffff"/>
  </g>
  <rect x="66" y="72" width="92" height="496" rx="28" fill="#18221f"/>
  <circle cx="112" cy="111" r="17" fill="url(#green)"/>
  <text x="112" y="117" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="950" fill="#fff">Org</text>
  <g fill="#44504c">
    <rect x="92" y="158" width="40" height="38" rx="13"/>
    <rect x="92" y="218" width="40" height="38" rx="13"/>
    <rect x="92" y="278" width="40" height="38" rx="13"/>
    <rect x="92" y="338" width="40" height="38" rx="13"/>
  </g>
  <rect x="92" y="278" width="40" height="38" rx="13" fill="#3d6ae0"/>

  <text x="190" y="118" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="950" fill="#16201d">Organizations</text>
  <rect x="548" y="92" width="96" height="34" rx="12" fill="url(#blue)"/>
  <text x="596" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="950" fill="#fff">Create new</text>

  <g filter="url(#soft)">
    <rect x="190" y="152" width="454" height="194" rx="20" fill="#f9fbfa"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="214" y="184" font-size="12" font-weight="950" fill="#6c7773">NAME</text>
    <text x="358" y="184" font-size="12" font-weight="950" fill="#6c7773">DOMAIN</text>
    <text x="526" y="184" font-size="12" font-weight="950" fill="#6c7773">STATUS</text>
    <line x1="214" y1="198" x2="620" y2="198" stroke="#dfe7e4"/>
    <text x="214" y="226" font-size="14" font-weight="950" fill="#16201d">Main academy</text>
    <text x="358" y="226" font-size="13" font-weight="850" fill="#6c7773">academy.example</text>
    <rect x="526" y="207" width="72" height="26" rx="13" fill="#e3f4e8"/>
    <text x="562" y="225" text-anchor="middle" font-size="11" font-weight="950" fill="#4b8b52">Active</text>
    <text x="214" y="268" font-size="14" font-weight="950" fill="#16201d">Company training</text>
    <text x="358" y="268" font-size="13" font-weight="850" fill="#6c7773">company.example</text>
    <rect x="526" y="249" width="72" height="26" rx="13" fill="#e3f4e8"/>
    <text x="562" y="267" text-anchor="middle" font-size="11" font-weight="950" fill="#4b8b52">Active</text>
    <text x="214" y="310" font-size="14" font-weight="950" fill="#16201d">School partner</text>
    <text x="358" y="310" font-size="13" font-weight="850" fill="#6c7773">school.example</text>
    <rect x="526" y="291" width="72" height="26" rx="13" fill="#e3f4e8"/>
    <text x="562" y="309" text-anchor="middle" font-size="11" font-weight="950" fill="#4b8b52">Active</text>
  </g>

  <g filter="url(#soft)">
    <rect x="190" y="380" width="214" height="132" rx="22" fill="#ffffff"/>
  </g>
  <text x="216" y="414" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="950" fill="#16201d">Course scope</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="950">
    <rect x="216" y="438" width="70" height="34" rx="12" fill="#e8efff" stroke="#2f63c7"/>
    <text x="251" y="460" text-anchor="middle" fill="#2f63c7">Org</text>
    <rect x="294" y="438" width="84" height="34" rx="12" fill="#f3f6f5"/>
    <text x="336" y="460" text-anchor="middle" fill="#7a8581">Business</text>
    <rect x="216" y="484" width="132" height="16" rx="8" fill="#dfe7e4"/>
  </g>

  <g filter="url(#soft)">
    <rect x="438" y="380" width="206" height="132" rx="22" fill="#ffffff"/>
  </g>
  <text x="464" y="414" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="950" fill="#16201d">Business models</text>
  <g>
    <circle cx="486" cy="456" r="17" fill="#dff4ee"/>
    <circle cx="548" cy="456" r="17" fill="#e8efff"/>
    <circle cx="610" cy="456" r="17" fill="#fff0d8"/>
    <path d="M503 456 h28 M565 456 h28" stroke="#bfcac6" stroke-width="5" stroke-linecap="round"/>
    <text x="486" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="900" fill="#5f6d68">B2B</text>
    <text x="548" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="900" fill="#5f6d68">School</text>
    <text x="610" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="900" fill="#5f6d68">Center</text>
  </g>

  <g filter="url(#soft)">
    <rect x="478" y="134" width="72" height="72" rx="24" fill="#ffffff"/>
    <rect x="584" y="134" width="72" height="72" rx="24" fill="#ffffff"/>
    <rect x="531" y="236" width="72" height="72" rx="24" fill="#ffffff"/>
  </g>
  <path d="M514 206 v20 c0 14 11 25 25 25 h28" fill="none" stroke="#168875" stroke-width="6" stroke-linecap="round"/>
  <path d="M620 206 v20 c0 14 -11 25 -25 25 h-28" fill="none" stroke="#2f63c7" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="950" fill="#16201d">
    <text x="514" y="176" text-anchor="middle">Org A</text>
    <text x="620" y="176" text-anchor="middle">Org B</text>
    <text x="567" y="278" text-anchor="middle">Shared</text>
  </g>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nền tảng học trực tuyến sẵn sàng triển khai</title>
    <link rel="stylesheet" href="assets/css/theme.css" />
  </head>
  <body class="home-page" data-lang="vi" data-asset-root="" data-locale-root="">
    <main class="shell">
      <section class="home-hero">
        <div>
          <span class="home-kicker">HTML slide deck</span>
          <h1 data-deck-title>Nền tảng học trực tuyến sẵn sàng triển khai</h1>
          <p data-deck-description>
            Deck 18 slide dành cho phần giới thiệu nền tảng: tập trung vào giá trị cho học viên,
            giảng viên và đội vận hành, tránh chi tiết kỹ thuật không cần thiết.
          </p>
          <div class="home-actions">
            <a class="button primary" href="slides/01.html" data-ui="start">Bắt đầu trình chiếu</a>
            <a class="button" href="print.html" data-ui="openPrint">Mở bản export PDF</a>
          </div>
          <nav class="language-switch" aria-label="Ngôn ngữ">
            <a href="index.html" data-language-link="vi">Tiếng Việt</a>
            <a href="en/index.html" data-language-link="en">English</a>
            <a href="my/index.html" data-language-link="my">မြန်မာ</a>
          </nav>
        </div>
        <figure class="home-preview">
          <img src="assets/images/generated/slide-01-learning-showcase.svg" alt="Minh họa trang học online với khóa học, lịch live và tiến độ" />
        </figure>
      </section>

      <section class="index-section" aria-labelledby="slideListTitle">
        <h2 id="slideListTitle" data-slide-list-title>Danh sách slide</h2>
        <div id="slideList" class="index-grid"></div>
      </section>
    </main>

    <script src="assets/js/deck-data.js"></script>
    <script src="assets/js/deck.js"></script>
  </body>
</html>
